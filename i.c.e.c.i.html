<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#02060a;color:#e8f0ff;font-family:Consolas,monospace;text-align:center;padding:16px}
h1{font-size:24px;letter-spacing:10px;color:#5cf0ff}
#sub{font-size:10px;letter-spacing:3px;color:#8aa0b0;margin:8px 0 14px}
#ice{font-size:40px;letter-spacing:12px;color:#fff;min-height:60px;text-shadow:0 0 20px #5cf0ff}
#stage{width:min(62vh,88vw);height:min(62vh,88vw);margin:0 auto;border-radius:50%;background:linear-gradient(180deg, rgba(92,240,255,.9), rgba(0,60,120,.9) 40%, rgba(240,208,128,.4) 100%);box-shadow:0 0 60px rgba(92,240,255,.5);display:flex;align-items:center;justify-content:center;flex-direction:column}

<h1>I C E C I</h1>
<div id="sub">i.c.e.c.i.html · DAS IST BEI MIR · WASSER ICE FÜR SICHT</div>
<div id="ice">I C E C I</div>
<div id="stage"><b>❄️</b><span>WASSER ICE</span><span>GATE SICHT LOCH</span></div>
<div><button id="bI">I</button><button id="bC">C</button><button id="bE">E</button><button id="bAll">I C E C I</button></div>
<div id="txt"></div>
<script>
let ice=document.getElementById("ice");
let txt=document.getElementById("txt");
let parts=["I","C","E","C","I"];
let i=0;
function show(p){ ice.textContent=p; txt.innerHTML="<b>"+p+"</b><br>i.c.e.c.i.html<br>Das ist bei mir<br>Wasser Ice für Sicht<br>Gate Sicht Loch"; }
document.getElementById("bI").onclick=()=>show("I");
document.getElementById("bC").onclick=()=>show("C");
document.getElementById("bE").onclick=()=>show("E");
document.getElementById("bAll").onclick=()=>show("I C E C I");
setInterval(()=>{ ice.textContent=parts[i%parts.length]; i++; },600);
show("I C E C I");
</script>
</body></html>
