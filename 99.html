<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACTIVE NODE · 9 99 999 PQ ORT HOME REAL_PC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050507;color:#e8f0ff;font-family:Consolas,monospace;padding:16px}
h1{font-size:14px;letter-spacing:5px;color:#ffd700}
#sub{font-size:10px;letter-spacing:2px;color:#8aa0b0;margin:6px 0 12px}
.kopf-nav{display:flex;gap:8px;flex-wrap:wrap}
.kopf-nav a{position:relative;background:#111;color:#e8f0ff;border:1px solid #333;padding:10px 14px;border-radius:8px;text-decoration:none;font-size:12px}
.kopf-nav a.active{background:#ffd700;color:#000;font-weight:900;box-shadow:0 0 8px #ffd700, 0 0 16px rgba(255,215,0,.4)}
.kopf-nav a.active::before{content:"► ";}
.kopf-nav a.active::after{content:attr(data-node);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#050507;color:#ffd700;border:1px solid #ffd700;padding:4px 8px;font-size:10px;z-index:10000}
#demo{margin-top:44px;border:1px solid #ffd700;border-radius:8px;padding:12px;font-size:11px;line-height:1.8;text-align:left}
#demo b{color:#ffd700}
button{background:#111;color:#ffd700;border:1px solid #ffd700;padding:8px 12px;border-radius:999px;cursor:pointer;font-family:inherit;margin:4px}
</style></head><body>
<h1>ACTIVE NODE · GOLD</h1>
<div id="sub">9 · 99 · 999 · PQ · ORT · HOME · REAL_PC · ► AKTIV</div>
<nav class="kopf-nav">
<a href="./9.html">9</a>
<a href="./99.html">99</a>
<a href="./999.html">999</a>
<a href="./PQ.html">PQ</a>
<a href="./ORT.html">ORT</a>
<a href="./HOME.html">HOME</a>
<a href="./REAL_PC.html">REAL_PC</a>
</nav>
<div id="demo"></div>
<div><button onclick="testNav('9.html')">TEST 9</button><button onclick="testNav('99.html')">TEST 99</button><button onclick="testNav('999.html')">TEST 999</button><button onclick="testNav('PQ.html')">TEST PQ</button><button onclick="testNav('ORT.html')">TEST ORT</button><button onclick="testNav('HOME.html')">TEST HOME</button><button onclick="testNav('REAL_PC.html')">TEST REAL_PC</button></div>
<script>
(function(){
  function setActive(page){
    const links = document.querySelectorAll(".kopf-nav a");
    links.forEach(function(link){
      const href = link.getAttribute("href").replace("./","");
      link.classList.remove("active");
      link.removeAttribute("data-node");
      if(href === page){
        link.classList.add("active");
        link.dataset.node = "ACTIVE NODE :: " + page.replace(".html","").toUpperCase();
      }
    });
    document.getElementById("demo").innerHTML =
      "<b>Seite = " + page + "</b><br>" +
      "Hervorgehobener Link = ► " + page.replace(".html","") + "<br>" +
      "Gold aktiv = #ffd700 · Schwarz Text · Fett 900<br>" +
      "Vorher war Grün #39ff88 · Jetzt ist Gold #ffd700<br>" +
      "9.html ► 9 · 99.html ► 99 · 999.html ► 999 · PQ.html ► PQ · ORT.html ► ORT · HOME.html ► HOME · REAL_PC.html ► REAL_PC";
  }
  window.testNav = setActive;
  let page = location.pathname.split("/").pop();
  if(!page || page === "" || page === "index.html"){ page = "HOME.html"; }
  setActive(page);
})();
</script>
</body></html>
