@media (prefers-color-scheme: dark) {
  :root {
    --bg: #050d09;
    --surface: #0a1711;
    --surface-2: #0e2017;
    --line: #294739;
    --text: #eaf5ec;
    --muted: #a1b8a7;
    --gold: #f0c94f;
    --green: #66d98d;
    --cyan: #72dccf;
    --red: #f07a78;
  }
}

* {
  box-sizing: border-box;
}

html {
  background: var(--bg);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

button {
  font: inherit;
}

button:focus-visible, a:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
}

.slow {
  transition: background-color .45s ease, color .45s ease, border-color .45s ease, transform .45s ease, opacity .45s ease, width .6s ease;
}

.disabled\:cursor-not-allowed:disabled {
  cursor: not-allowed;
}

.disabled\:opacity-40:disabled {
  opacity: 0.4;
}

@media (min-width: 640px) {
  .sm\:col-span-1 {
    grid-column: span 1 / span 1;
  }

  .sm\:col-span-3 {
    grid-column: span 3 / span 3;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:grid-cols-5 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:text-4xl {
    font-size: 2.25rem;
    line-height: 2.5rem;
  }

  .sm\:text-7xl {
    font-size: 4.5rem;
    line-height: 1;
  }

  .sm\:text-\[13px\] {
    font-size: 13px;
  }

  .sm\:text-xl {
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.1fr_\.9fr\] {
    grid-template-columns: 1.1fr .9fr;
  }

  .lg\:grid-cols-\[1\.35fr_\.65fr\] {
    grid-template-columns: 1.35fr .65fr;
  }

  .lg\:grid-cols-\[1\.45fr_\.55fr\] {
    grid-template-columns: 1.45fr .55fr;
  }

  .lg\:grid-cols-\[1fr_300px\] {
    grid-template-columns: 1fr 300px;
  }

  .lg\:grid-cols-\[1fr_360px\] {
    grid-template-columns: 1fr 360px;
  }

  .lg\:items-end {
    align-items: flex-end;
  }

  .lg\:px-8 {
    padding-left: 2rem;
    padding-right: 2rem;
  }
}
