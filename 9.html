*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
}

body{
  font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

::-moz-selection{
  background:#0f0;
  color:#000;
}

::selection{
  background:#0f0;
  color:#000;
}

.scan{
  background-image: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,255,0,.035) 3px 4px);
}

.blink{
  animation: blink 1.1s steps(2) infinite;
}

@keyframes blink{
  50%{
    opacity:0;
  }
}

.marquee{
  animation: marquee 18s linear infinite;
}

@keyframes marquee{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-50%);
  }
}

input[type="range"]{
  accent-color:#0f0;
}

button{
  font-family:inherit;
}

.hover\:bg-\[\#0a2a0a\]:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(10 42 10 / var(--tw-bg-opacity, 1));
}

.hover\:bg-\[\#0f0\]:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(0 255 0 / var(--tw-bg-opacity, 1));
}

.hover\:bg-\[\#ccff00\]:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(204 255 0 / var(--tw-bg-opacity, 1));
}

.hover\:text-black:hover {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

@media (min-width: 640px) {
  .sm\:inline {
    display: inline;
  }

  .sm\:h-\[300px\] {
    height: 300px;
  }

  .sm\:w-\[300px\] {
    width: 300px;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:divide-x > :not([hidden]) ~ :not([hidden]) {
    --tw-divide-x-reverse: 0;
    border-right-width: calc(1px * var(--tw-divide-x-reverse));
    border-left-width: calc(1px * calc(1 - var(--tw-divide-x-reverse)));
  }

  .sm\:divide-y-0 > :not([hidden]) ~ :not([hidden]) {
    --tw-divide-y-reverse: 0;
    border-top-width: calc(0px * calc(1 - var(--tw-divide-y-reverse)));
    border-bottom-width: calc(0px * var(--tw-divide-y-reverse));
  }

  .sm\:p-4 {
    padding: 1rem;
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:px-4 {
    padding-left: 1rem;
    padding-right: 1rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:py-5 {
    padding-top: 1.25rem;
    padding-bottom: 1.25rem;
  }

  .sm\:text-2xl {
    font-size: 1.5rem;
    line-height: 2rem;
  }

  .sm\:text-3xl {
    font-size: 1.875rem;
    line-height: 2.25rem;
  }

  .sm\:text-\[64px\] {
    font-size: 64px;
  }

  .sm\:text-base {
    font-size: 1rem;
    line-height: 1.5rem;
  }

  .sm\:text-sm {
    font-size: 0.875rem;
    line-height: 1.25rem;
  }

  .sm\:text-xl {
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:text-\[76px\] {
    font-size: 76px;
  }
}
