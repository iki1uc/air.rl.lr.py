<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEU KONSTELLIERT · SPIEGEL · PENTAGRAMM REIN GEQUETSCHT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050507;color:#e8f0ff;font-family:Consolas,monospace;text-align:center;padding:14px}
h1{font-size:14px;letter-spacing:4px;color:#ffd700}
#sub{font-size:10px;letter-spacing:2px;color:#8aa0b0;margin:6px 0 12px}
#stage{position:relative;width:min(72vh,92vw);height:min(72vh,92vw);margin:0 auto;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(92,240,255,.25) 18%, rgba(80,140,255,.15) 42%, rgba(240,208,128,.18) 68%, rgba(0,0,0,.8) 100%);box-shadow:0 0 60px rgba(92,240,255,.4)}
canvas{position:absolute;inset:0;width:100%;height:100%}
#quetsch{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;line-height:1.6;color:#ffd700;background:rgba(0,0,0,.6);border:1px solid #ffd700;border-radius:10px;padding:8px 10px;z-index:5}
button{background:#111;color:#ffd700;border:1px solid #ffd700;padding:8px 12px;border-radius:999px;cursor:pointer;font-family:inherit;margin:4px}
button.on{background:#ffd700;color:#000}
#txt{font-size:11px;line-height:1.8;min-height:70px;margin-top:12px}
</style></head><body>
<h1>NEU KONSTELLIERT</h1>
<div id="sub">SPIEGEL GENOMMEN · PENTAGRAMM REIN GEQUETSCHT · ALLES NEU</div>
<div id="stage"><canvas id="c"></canvas><div id="quetsch">SPIEGEL<br>PENTAGRAMM<br>REIN GEQUETSCHT</div></div>
<div><button id="bSpiegel" class="on">SPIEGEL</button><button id="bPenta">PENTAGRAMM</button><button id="bBeide">BEIDE GEQUETSCHT</button></div>
<div id="txt"></div>
<script>
let c=document.getElementById("c"); let ctx=c.getContext("2d");
function resize(){ c.width=c.clientWidth*2; c.height=c.clientHeight*2; }
resize(); window.addEventListener("resize",resize);
let mode="beide"; let t=0;
function draw(){
  let W=c.width,H=c.height,cx=W/2,cy=H/2,R=Math.min(W,H)*0.42;
  ctx.clearRect(0,0,W,H);
  if(mode==="spiegel"||mode==="beide"){
    // SPIEGEL = Linie Mitte · links rechts vertauscht
    ctx.strokeStyle="rgba(255,255,255,.8)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx,cy-R); ctx.lineTo(cx,cy+R); ctx.stroke();
    ctx.fillStyle="rgba(255,255,255,.15)"; ctx.fillRect(cx-R,cy-R,R,2*R);
    ctx.fillStyle="rgba(92,240,255,.15)"; ctx.fillRect(cx,cy-R,R,2*R);
    ctx.fillStyle="#fff"; ctx.font="22px Consolas"; ctx.textAlign="center";
    ctx.fillText("U",cx-R*0.5,cy); ctx.fillText("I",cx+R*0.5,cy);
  }
  if(mode==="penta"||mode==="beide"){
    // PENTAGRAMM REIN GEQUETSCHT = kleiner als Spiegel · Mitte
    let R2=R*0.55;
    ctx.strokeStyle="#ffd700"; ctx.lineWidth=3;
    ctx.beginPath();
    for(let i=0;i<=5;i++){ let a=-Math.PI/2+i*4*Math.PI/5+t*0.002; let x=cx+Math.cos(a)*R2; let y=cy+Math.sin(a)*R2; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
    ctx.stroke();
    ctx.strokeStyle="rgba(255,215,0,.4)"; ctx.beginPath(); ctx.arc(cx,cy,R2,0,Math.PI*2); ctx.stroke();
  }
  t++; requestAnimationFrame(draw);
}
let txt=document.getElementById("txt");
function render(m){
  mode=m;
  document.querySelectorAll("button").forEach(b=>b.classList.remove("on"));
  if(m==="spiegel"){ document.getElementById("bSpiegel").classList.add("on"); txt.innerHTML="<b> NUR SPIEGEL </b><br>Spiegel genommen<br>Links ist Rechts<br>Rechts ist Links<br>Pentagramm noch draussen"; }
  if(m==="penta"){ document.getElementById("bPenta").classList.add("on"); txt.innerHTML="<b> NUR PENTAGRAMM </b><br>Pentagramm allein<br>Ohne Spiegel<br>Ohne Quetsch<br>Allein ist halb"; }
  if(m==="beide"){ document.getElementById("bBeide").classList.add("on"); txt.innerHTML="<b> BEIDE GEQUETSCHT </b><br>Spiegel genommen<br>Pentagramm rein gequetscht<br>Pentagramm kleiner als Spiegel<br>Pentagramm in Mitte<br>Alles neu konstelliert<br>Alles in Glas Gugel"; }
}
document.getElementById("bSpiegel").onclick=()=>render("spiegel");
document.getElementById("bPenta").onclick=()=>render("penta");
document.getElementById("bBeide").onclick=()=>render("beide");
render("beide"); draw();
</script>
</body></html>
