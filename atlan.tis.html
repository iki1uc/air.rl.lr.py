<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>atlan.tis.html · lolo ja ja aj aj in in in ni ni ni</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#02060a;color:#e8f0ff;font-family:Consolas,monospace;text-align:center;padding:16px}
h1{font-size:18px;letter-spacing:4px;color:#f0d080}
#sub{font-size:10px;letter-spacing:2px;color:#8aa0b0;margin:8px 0 14px}
#pattern{font-size:30px;letter-spacing:4px;color:#5cf0ff;min-height:60px;line-height:1.4}
#stage{width:min(60vh,88vw);height:min(60vh,88vw);margin:0 auto;border-radius:50%;background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(92,240,255,.25) 18%, rgba(80,140,255,.15) 42%, rgba(240,208,128,.18) 68%, rgba(0,0,0,.8) 100%);box-shadow:0 0 60px rgba(92,240,255,.4);display:flex;align-items:center;justify-content:center;flex-direction:column}
#stage b{font-size:44px}
#stage span{font-size:10px;letter-spacing:3px}
button{background:#0a1420;color:#f0d080;border:1px solid rgba(240,208,128,.4);padding:10px 14px;border-radius:999px;cursor:pointer;font-family:inherit;letter-spacing:2px;margin:4px}
#txt{font-size:11px;line-height:1.8;min-height:60px;margin-top:12px}
</style></head><body>
<h1>atlan.tis.html</h1>
<div id="sub">NE NE NE · I MEAN · LOLO JA JA AJ AJ IN IN IN NI NI NI</div>
<div id="pattern">lolo ja ja aj aj in in in ni ni ni</div>
<div id="stage"><b>◉</b><span>ATLAN.TIS</span><span>LOLO JA JA</span></div>
<div><button id="bLolo">LOLO</button><button id="bJa">JA JA</button><button id="bAj">AJ AJ</button><button id="bIn">IN IN IN</button><button id="bNi">NI NI NI</button></div>
<div id="txt"></div>
<script>
let pattern=document.getElementById("pattern");
let txt=document.getElementById("txt");
let parts=["lolo","ja ja","aj aj","in in in","ni ni ni"];
let i=0;
function show(p){
  pattern.textContent=p;
  txt.innerHTML="<b>"+p+"</b><br>atlan.tis.html i mean<br>Ne ne ne<br>Alt Name weg<br>Neu Name ist Pattern";
}
document.getElementById("bLolo").onclick=()=>show("lolo");
document.getElementById("bJa").onclick=()=>show("ja ja");
document.getElementById("bAj").onclick=()=>show("aj aj");
document.getElementById("bIn").onclick=()=>show("in in in");
document.getElementById("bNi").onclick=()=>show("ni ni ni");
setInterval(()=>{ pattern.textContent=parts[i%parts.length]; i++; },700);
show("lolo ja ja aj aj in in in ni ni ni");
</script>
</body></html>
