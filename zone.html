@keyframes quad-celebrate{
  0%{
    transform:translateY(0) scale(1);
    opacity:1
  }
  50%{
    transform:translateY(-12px) scale(1.4);
    opacity:.9
  }
  100%{
    transform:translateY(0) scale(1);
    opacity:1
  }
}

  animation:quad-celebrate 1s ease-in-out infinite
}

}

  animation-delay:.3s

  animation-delay:.6s

  animation-delay:.75s

  }

  }

  }
}
