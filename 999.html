<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROOMS · WECHSEL 2 TIEFE · KEIN BR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050507;color:#e8f0ff;font-family:Consolas,monospace;padding:14px}
h1{font-size:14px;letter-spacing:5px;color:#39ff88}
#sub{font-size:10px;letter-spacing:2px;color:#8aa0b0;margin:6px 0 12px}
.kopf-nav{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.kopf-nav a{position:relative;background:#111;color:#e8f0ff;border:1px solid #333;padding:8px 12px;border-radius:8px;text-decoration:none;font-size:11px}
.kopf-nav a.active{background:#000;color:#39ff88;border-color:#39ff88;box-shadow:0 0 12px #39ff88}
.kopf-nav a.active::after{content:attr(data-node);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#050507;color:#39ff88;border:1px solid #39ff88;padding:4px 8px;font-size:10px;z-index:10000;box-shadow:0 0 12px rgba(57,255,136,.4)}
#rooms{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
#rooms button{background:#111;color:#e8f0ff;border:1px solid #333;padding:10px 14px;border-radius:8px;cursor:pointer;font-family:inherit}
#rooms button.on{background:#39ff88;color:#000}
#room-node-info{font-size:12px;color:#39ff88;margin:8px 0}
#rinfo{font-size:11px;color:#c8d8e8}
#core-val{font-size:36px;color:#f0d080}
#core-sub{font-size:11px;color:#c8d8e8}
#wurzeln-live{display:flex;gap:8px;margin:12px 0}
.w-box{border:1px solid #333;padding:8px;border-radius:8px;min-width:90px}
.w-box .lbl{font-size:9px;letter-spacing:2px;color:#8aa0b0}
.w-box .val{font-size:16px}
.kopf-state{font-size:11px}
.kopf-state.bad{color:#ff4444}
.kopf-state.warn{color:#ffcc00}
#mobile-toggle{margin-top:10px;background:#111;color:#e8f0ff;border:1px solid #333;padding:8px 12px;border-radius:8px;cursor:pointer}
#mobile-panel{display:none;margin-top:8px}
#mobile-panel.open{display:block}
#mobile-panel a{display:block;color:#e8f0ff;margin:4px 0}
#fix{margin-top:14px;border:1px solid #39ff88;border-radius:8px;padding:10px;font-size:11px;line-height:1.8;text-align:left}
</style></head><body>
<h1>ROOMS · WECHSEL 2 TIEFE</h1>
<div id="sub">KEIN BR IN STYLE · KEIN BR IN SCRIPT · BEIDE NAV IM WECHSEL</div>
<nav class="kopf-nav">
<a href="./home.html">HOME</a>
<a href="./9.html">9</a>
<a href="./99.html">99</a>
<a href="./999.html">999</a>
<a href="./index.html">INDEX</a>
</nav>
<button id="mobile-toggle">☰ NODE</button>
<div id="mobile-panel"><a href="./home.html">HOME</a><a href="./9.html">9</a><a href="./99.html">99</a><a href="./999.html">999</a></div>
<div id="brain-state" class="kopf-state">● BRAIN.EYE.OPEN</div>
<div id="rooms"></div>
<div id="room-node-info">◉ ACTIVE NODE</div>
<div id="rinfo">Raum</div>
<div id="core-val">9</div>
<div id="core-sub">EVIG</div>
<div id="wurzeln-live"></div>
<div id="fix"></div>
<script>
"use strict";
// KEIN BR HIER · KEIN BR IN STYLE · KEIN BR IN SCRIPT
// WURZEL_STATE Stub falls nicht geladen
if(typeof WURZEL_STATE === "undefined"){
  var WURZEL_STATE = {
    _S: { activeSlot: 0 },
    zustand: function(){ return { HOME: "OPEN", ORT: "DA", PRUEF: "OK" }; },
    tmp: function(){ return 81; },
    slotSet: function(s, f){ this._S.activeSlot = s; },
    onRemote: null
  };
}
const ROOMS = [
  ["111","BIOS"],
  ["222","VERBUND"],
  ["333","RECALL"],
  ["444","PEAK"],
  ["555","ABWEHR"],
  ["666","ENERGIE"],
  ["777","CO2"],
  ["888","ATOM"],
  ["999","BENCH"]
];
const TRI = [
  ["9","EVIG","Zustand nicht Zaehler"],
  ["99","EDIT TOR","CALL RECALL ALLCALL"],
  ["999","NUTZ SYSTEM","BENCH alle 9 auf einer Bank"]
];
let activeRoom = 0;
// NAV WECHSEL 2 TIEFE
// Tiefe 1 = einfacher Vergleich target === current
// Tiefe 2 = HOME Fallback fuer leer index home
// Wechsel: gerade Klick = Tiefe 1 · ungerade Klick = Tiefe 2
// Ein in Tiefe = ein Quant Tiefe LAN
let wechsel = 1;
let wechselCount = 0;
function navWechsel(){
  wechselCount = wechselCount + 1;
  wechsel = wechselCount % 2 === 0 ? 2 : 1;
  let current = (location.pathname.split("/").pop() || "home").replace(".html","").toLowerCase();
  if(current === "" || current === "index"){ current = "home"; }
  document.querySelectorAll(".kopf-nav a, #mobile-panel a").forEach(function(a){
    let target = a.getAttribute("href").replace("./","").replace(".html","").toLowerCase();
    a.classList.remove("active");
    a.removeAttribute("data-node");
    if(wechsel === 1){
      if(target === current){
        a.classList.add("active");
        a.dataset.node = "ACTIVE NODE :: " + target.toUpperCase();
      }
    } else {
      if(target === current || (target === "home" && (current === "home" || current === ""))){
        a.classList.add("active");
        a.dataset.node = "ACTIVE NODE :: " + target.toUpperCase() + " · TIEFE 2";
      }
      if(target === "home" && current === "home"){
        a.classList.add("active");
      }
    }
  });
  document.getElementById("fix").innerHTML =
    "WECHSEL = " + wechsel + " · TIEFE WECHSEL<br>" +
    "Klick " + wechselCount + " · Ein in Tiefe = ein Quant Tiefe LAN<br>" +
    "Tiefe 1 = direkt · Tiefe 2 = HOME Fallback<br>" +
    "Beide Nav im Wechsel · Nicht beide zugleich";
}
navWechsel();
const mobileToggle = document.getElementById("mobile-toggle");
const mobilePanel = document.getElementById("mobile-panel");
mobileToggle.addEventListener("click", function(){
  mobilePanel.classList.toggle("open");
  navWechsel();
});
document.getElementById("rooms").innerHTML = ROOMS.map(function(r,i){
  return "<button data-room=\"" + i + "\">" + r[0] + "</button>";
}).join("");
function draw(){
  if(typeof WURZEL_STATE === "undefined"){ return; }
  const S = WURZEL_STATE._S;
  let activeSlot = Number.isInteger(S.activeSlot) ? S.activeSlot : 0;
  activeRoom = Math.max(0, Math.min(8, Math.floor(activeSlot / 9)));
  const rm = ROOMS[activeRoom];
  const tri = TRI[Math.floor(activeRoom / 3)];
  const Z = WURZEL_STATE.zustand();
  const tmp = WURZEL_STATE.tmp();
  // RAR FIX: rar = 81 - (slot % 9) · dann * 9 fuer WAHRHEIT Variante
  const rar = 81 - (activeSlot % 9);
  const wahrheit = (tmp * rar / 729).toFixed(2);
  const wahrheit2 = (tmp * (81 - (activeSlot % 9) * 9) / 729).toFixed(2);
  document.querySelectorAll("[data-room]").forEach(function(b,i){
    b.classList.toggle("on", i === activeRoom);
  });
  document.getElementById("room-node-info").textContent = "◉ ACTIVE NODE " + rm[0] + " // " + rm[1] + " → " + tri[0] + " " + tri[1];
  document.getElementById("rinfo").textContent = "Raum " + rm[0] + " " + rm[1] + " · TMP " + tmp + " · WAHRHEIT " + wahrheit + " · WAHRHEIT2 " + wahrheit2 + " · RAR " + rar;
  document.getElementById("core-val").textContent = tri[0];
  document.getElementById("core-sub").textContent = tri[1] + " — " + tri[2];
  document.getElementById("wurzeln-live").innerHTML = ["HOME","ORT","PRUEF"].map(function(name){
    return "<div class=\"w-box\"><div class=\"lbl\">" + name + "</div><div class=\"val\">" + (Z[name] || "-") + "</div></div>";
  }).join("");
  const headerState = document.getElementById("brain-state");
  if(Z.PRUEF === "FEHLER" || Z.HOME === "CLOSED"){
    headerState.textContent = "● BRAIN.EYE.CLOSED";
    headerState.className = "kopf-state bad";
  } else if(Z.PRUEF === "UNGEPRUEFT"){
    headerState.textContent = "● BRAIN.EYE.WAIT";
    headerState.className = "kopf-state warn";
  } else {
    headerState.textContent = "● BRAIN.EYE.OPEN";
    headerState.className = "kopf-state";
  }
  mobileToggle.textContent = "☰ NODE : " + rm[0] + " / " + tri[0];
}
document.addEventListener("click", function(e){
  const b = e.target.closest("[data-room]");
  if(!b){ return; }
  activeRoom = Number(b.dataset.room);
  if(typeof WURZEL_STATE !== "undefined"){
    const slot = activeRoom * 9;
    WURZEL_STATE._S.activeSlot = slot;
    if(typeof WURZEL_STATE.slotSet === "function"){
      WURZEL_STATE.slotSet(slot, true);
    }
  }
  draw();
});
if(typeof WURZEL_STATE !== "undefined"){
  WURZEL_STATE.onRemote = draw;
  draw();
}
</script>
</body></html>
